# SentinelFlow frontend nginx config (Docker serve stage).
#
# Two jobs:
#   1. serve the built SPA with a history-API fallback (react-router routes)
#   2. reverse-proxy /api, /health and /ready to the backend service so the
#      browser stays on ONE origin — no CORS, and VITE_API_BASE_URL stays empty.
#
# `backend` is the docker-compose service name (resolved by compose DNS).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: any unknown path serves index.html so client-side
    # routing (e.g. /incidents, /approvals) works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy. proxy_pass without a URI part preserves the original
    # request path (/api/v1/...), which is exactly what the backend mounts.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Local LLM analyses (AI Local Mode) can take tens of seconds.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Liveness / readiness proxied too, so doctor / smoke / an orchestrator can
    # reach them on the same origin as the UI.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }
    location = /ready {
        proxy_pass http://backend:8000/ready;
        proxy_set_header Host $host;
    }
}
